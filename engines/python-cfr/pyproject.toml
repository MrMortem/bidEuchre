[project]
name = "bideuchre-cfr"
version = "0.1.0"
description = "Self-improving PyTorch CFR engine for Bid Euchre"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10,<3",
]

[project.scripts]
bideuchre-cfr = "bideuchre_cfr.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bideuchre_cfr"]
